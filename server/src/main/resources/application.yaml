spring:
  application:
    name: server

  docker:
    compose:
      file: "../infrastructure/docker/compose.yml"
      enabled: true
      lifecycle-management: start-and-stop

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
      - classpath:db/migration/common
      - classpath:db/migration/auth
      - classpath:db/migration/organization
      - classpath:db/migration/tenant
      - classpath:db/migration/core
      - classpath:db/migration/resource
      - classpath:db/migration/customer
      - classpath:db/migration/widget
      - classpath:db/migration/integration
      - classpath:db/migration/notification
      - classpath:db/migration/audit

  security:
    user:
      name: "${SPRING_SECURITY_USERNAME}"
      password: "${SPRING_SECURITY_PASSWORD}"

    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar
              - https://www.googleapis.com/auth/spreadsheets
              - https://www.googleapis.com/auth/drive.file

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

security:
  jwt:
    issuer: pleasebookme

    audience: pleasebookme-api

    algorithm: HS256

    secret: ${JWT_SECRET}

    access-token-life-time: PT15M

    refresh-token-life-time: P30D

  token-encryption:
    current-version: ${TOKEN_ENCRYPTION_CURRENT_VERSION}

    keys:
      1: ${TOKEN_ENCRYPTION_KEY_V1}

app:
  client:
    frontend-url: http://localhost:3000

  widget:
    frontend-url: http://localhost:3001

  internal:
    frontend-url: http://localhost:3002

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002

    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

    allowed-headers:
      - Authorization
      - Content-Type

    exposed-headers:
      - Location

    allow-credentials: true

    max-age: PT30M
