<style>
        body {
            background-image: radial-gradient(circle at 50% 0%, #1c2026 0%, #0a0e14 100%);
            background-attachment: fixed;
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(66, 71, 84, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(66, 71, 84, 0.1) 1px, transparent 1px);
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #101419; }
        ::-webkit-scrollbar-thumb { background: #31353b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #424754; }
    </style>

<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md md:p-lg relative overflow-hidden font-sans">
<!-- Background Grid Effect -->
<div class="absolute inset-0 z-0 bg-grid pointer-events-none"></div>
<!-- Main Card Container -->
<main class="relative z-10 w-full max-w-[420px] bg-surface-container border border-outline-variant rounded-xl p-xl shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
<!-- Brand Header -->
<div class="flex items-center gap-xs mb-xl">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">book_online</span>
<span class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight">PleaseBookMe</span>
</div>
<!-- Title & Subtitle -->
<div class="mb-xl">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-xs">Reset password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter a new password below to regain access to your infrastructure workspace.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault(); alert('Password reset triggered.');">
<!-- New Password Field Group -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-background border border-outline-variant rounded-[10px] px-sm py-[10px] font-mono-label text-mono-label text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/50 transition-all" id="new-password" name="new-password" oninput="updateStrength(this.value)" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword('new-password', 'icon-new-pwd')" type="button">
<span class="material-symbols-outlined text-[18px]" id="icon-new-pwd">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-xs">
<div class="flex gap-[2px] h-[4px] rounded-full overflow-hidden bg-surface-variant">
<div class="h-full w-1/4 bg-surface-variant transition-colors duration-300" id="strength-1"></div>
<div class="h-full w-1/4 bg-surface-variant transition-colors duration-300" id="strength-2"></div>
<div class="h-full w-1/4 bg-surface-variant transition-colors duration-300" id="strength-3"></div>
<div class="h-full w-1/4 bg-surface-variant transition-colors duration-300" id="strength-4"></div>
</div>
<div class="flex justify-between items-center mt-base">
<span class="font-mono-label text-[10px] leading-none text-on-surface-variant uppercase" id="strength-text">Too short</span>
<span class="font-mono-label text-[10px] leading-none text-outline">Min 12 chars</span>
</div>
</div>
</div>
<!-- Confirm Password Field Group -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-background border border-outline-variant rounded-[10px] px-sm py-[10px] font-mono-label text-mono-label text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/50 transition-all" id="confirm-password" name="confirm-password" placeholder="••••••••••••" required="" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" onclick="togglePassword('confirm-password', 'icon-confirm-pwd')" type="button">
<span class="material-symbols-outlined text-[18px]" id="icon-confirm-pwd">visibility_off</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="mt-md flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-[10px] rounded-[10px] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container transition-all flex justify-center items-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[18px]">lock_reset</span>
                    Update Password
                </button>
<a class="text-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center gap-[4px]" href="#">
<span class="material-symbols-outlined text-[14px]">arrow_back</span>
                    Back to login
                </a>
</div>
</form>
</main>
<script>
        // Simple toggle for password visibility
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === "password") {
                input.type = "text";
                icon.innerText = "visibility";
            } else {
                input.type = "password";
                icon.innerText = "visibility_off";
            }
        }

        // Basic password strength logic for UI feedback
        function updateStrength(pwd) {
            let strength = 0;
            if (pwd.length > 0) strength = 1;
            if (pwd.length >= 8) strength = 2;
            if (pwd.length >= 12 && /[A-Z]/.test(pwd) && /[0-9]/.test(pwd)) strength = 3;
            if (pwd.length >= 14 && /[^A-Za-z0-9]/.test(pwd)) strength = 4;

            const b1 = document.getElementById('strength-1');
            const b2 = document.getElementById('strength-2');
            const b3 = document.getElementById('strength-3');
            const b4 = document.getElementById('strength-4');
            const text = document.getElementById('strength-text');

            // Reset classes
            const baseClass = 'h-full w-1/4 transition-colors duration-300 ';
            b1.className = baseClass + 'bg-surface-variant';
            b2.className = baseClass + 'bg-surface-variant';
            b3.className = baseClass + 'bg-surface-variant';
            b4.className = baseClass + 'bg-surface-variant';

            if (strength === 0) {
                text.innerText = 'ENTER PASSWORD';
                text.className = 'font-mono-label text-[10px] leading-none uppercase text-on-surface-variant';
            } else if (strength === 1) {
                b1.className = baseClass + 'bg-error';
                text.innerText = 'WEAK';
                text.className = 'font-mono-label text-[10px] leading-none uppercase text-error';
            } else if (strength === 2) {
                b1.className = baseClass + 'bg-tertiary-container';
                b2.className = baseClass + 'bg-tertiary-container';
                text.innerText = 'FAIR';
                text.className = 'font-mono-label text-[10px] leading-none uppercase text-tertiary-container';
            } else if (strength === 3) {
                b1.className = baseClass + 'bg-secondary';
                b2.className = baseClass + 'bg-secondary';
                b3.className = baseClass + 'bg-secondary';
                text.innerText = 'GOOD';
                text.className = 'font-mono-label text-[10px] leading-none uppercase text-secondary';
            } else if (strength === 4) {
                b1.className = baseClass + 'bg-primary';
                b2.className = baseClass + 'bg-primary';
                b3.className = baseClass + 'bg-primary';
                b4.className = baseClass + 'bg-primary';
                text.innerText = 'STRONG';
                text.className = 'font-mono-label text-[10px] leading-none uppercase text-primary';
            }
        }
    </script>
</body></html>
