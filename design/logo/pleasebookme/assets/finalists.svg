<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="PleaseBookMe four finalist logo concepts"><title>PleaseBookMe four finalist logo concepts</title><style>.eyebrow{font:600 15px Arial,sans-serif;letter-spacing:3px;fill:#B7192B}.title{font:600 43px Arial,sans-serif;fill:#111214}.name{font:600 22px Arial,sans-serif;fill:#111214}.desc{font:14px Arial,sans-serif;fill:#666}</style><path fill="#F6F5F2" d="M0 0H1200V820H0Z"/><text x="60" y="78" class="eyebrow">SHORTLIST / FOUR DIRECTIONS</text><text x="60" y="135" class="title">Aperture has the clearest memory.</text><rect x="60" y="205" width="264" height="500" fill="white" stroke="#E5E2DB"/><g transform="translate(94 264) scale(1.96)"><path fill="#111214" d="M16 15H81V30H32V70H81V85H16Z"/><path fill="#B7192B" d="M66 43H81V70H66Z"/></g><text x="84" y="526" class="name">APERTURE</text><text x="84" y="560" class="desc">Selected interval</text><text x="84" y="582" class="desc">in a bounded window</text><g transform="translate(84 600) scale(.5)"><path fill="#111214" d="M16 15H81V30H32V70H81V85H16Z"/><path fill="#B7192B" d="M66 43H81V70H66Z"/></g><g transform="translate(145 607) scale(.36)"><path fill="#111214" d="M16 15H81V30H32V70H81V85H16Z"/><path fill="#111214" d="M66 43H81V70H66Z"/></g><rect x="342" y="205" width="264" height="500" fill="white" stroke="#E5E2DB"/><g transform="translate(376 264) scale(1.96)"><path fill="#111214" d="M19 15H71V29H35V43H72V15H86V57H35V85H19Z"/><path fill="#B7192B" d="M72 43H86V57H72Z"/></g><text x="366" y="526" class="name">P MONOGRAM</text><text x="366" y="560" class="desc">Direct initial with</text><text x="366" y="582" class="desc">a segmented bowl</text><g transform="translate(366 600) scale(.5)"><path fill="#111214" d="M19 15H71V29H35V43H72V15H86V57H35V85H19Z"/><path fill="#B7192B" d="M72 43H86V57H72Z"/></g><g transform="translate(427 607) scale(.36)"><path fill="#111214" d="M19 15H71V29H35V43H72V15H86V57H35V85H19Z"/><path fill="#111214" d="M72 43H86V57H72Z"/></g><rect x="624" y="205" width="264" height="500" fill="white" stroke="#E5E2DB"/><g transform="translate(658 264) scale(1.96)"><path fill="#111214" fill-rule="evenodd" d="M17 17H83V83H17ZM34 34V66H66V34Z"/><path fill="#B7192B" d="M66 17H83V34H66Z"/></g><text x="648" y="526" class="name">KEYHOLE</text><text x="648" y="560" class="desc">Reserved corner around</text><text x="648" y="582" class="desc">an open center</text><g transform="translate(648 600) scale(.5)"><path fill="#111214" fill-rule="evenodd" d="M17 17H83V83H17ZM34 34V66H66V34Z"/><path fill="#B7192B" d="M66 17H83V34H66Z"/></g><g transform="translate(709 607) scale(.36)"><path fill="#111214" fill-rule="evenodd" d="M17 17H83V83H17ZM34 34V66H66V34Z"/><path fill="#111214" d="M66 17H83V34H66Z"/></g><rect x="906" y="205" width="264" height="500" fill="white" stroke="#E5E2DB"/><g transform="translate(940 264) scale(1.96)"><path fill="#111214" d="M17 17H72V32H32V72H17ZM39 68H68V39H83V83H39Z"/><path fill="#B7192B" d="M68 17H83V32H68Z"/></g><text x="930" y="526" class="name">QUARTER-TURN</text><text x="930" y="560" class="desc">Two offset moments</text><text x="930" y="582" class="desc">in one frame</text><g transform="translate(930 600) scale(.5)"><path fill="#111214" d="M17 17H72V32H32V72H17ZM39 68H68V39H83V83H39Z"/><path fill="#B7192B" d="M68 17H83V32H68Z"/></g><g transform="translate(991 607) scale(.36)"><path fill="#111214" d="M17 17H72V32H32V72H17ZM39 68H68V39H83V83H39Z"/><path fill="#111214" d="M68 17H83V32H68Z"/></g></svg>