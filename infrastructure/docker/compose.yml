name: pleasebookme

services:
  postgres:
    image: postgres:16
    container_name: pleasebookme_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - pleasebookme_data:/var/lib/postgresql/data
      - ./backups:/backups

    networks:
      - pleasebookme_network

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -h localhost -U ${POSTGRES_USERNAME} -d ${DB_NAME}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  
  redis:
    image: redis:8.2-alpine
    container_name: pleasebookme_redis
    restart: unless-stopped

    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD}",
      "--appendonly", "yes",
      "--maxmemory-policy", "noeviction"
    ]

    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

    volumes:
      - pleasebookme_redis_data:/data

    networks:
      - pleasebookme_network

    labels:
      org.springframework.boot.ignore: "true"

    healthcheck:
      test: [
        "CMD-SHELL",
        "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pleasebookme_pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    ports:
      - "${PGADMIN_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - pleasebookme_network

    depends_on:
      postgres:
        condition: service_healthy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  pleasebookme_data:
    name: pleasebookme_data

  pleasebookme_redis_data:
    name: pleasebookme_redis_data

  pgadmin_data:
    name: pleasebookme_pgadmin_data

networks:
  pleasebookme_network:
    driver: bridge
    internal: false
